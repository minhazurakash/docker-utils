version: "3.9"

services:
  redis:
    image: redis:7.2
    container_name: redis
    command: ["redis-server", "--requirepass", "akash"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    ports:
      - "5540:5540"
    volumes:
      - redisinsight-data:/data
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis-data:
  redisinsight-data:
